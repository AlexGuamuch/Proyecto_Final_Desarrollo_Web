# Blueprint de Render: https://render.com/docs/blueprint-spec
# Las rutas son relativas a la raíz del repositorio.
services:
  - type: web
    name: lecciones-service
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./lecciones-service/Dockerfile
    dockerContext: ./lecciones-service
    healthCheckPath: /actuator/health
    # Despliega solo cuando el workflow de GitHub Actions (compilación + pruebas) pasa.
    autoDeployTrigger: checksPass
    # Cambios solo en docs/ o scripts/ no disparan un nuevo despliegue.
    buildFilter:
      paths:
        - lecciones-service/**
    envVars:
      # Importar, exportar y eliminar lecciones (opciones de Configuración que la fase 1 pide
      # funcionando en memoria). Sin autenticación hasta la fase 2; "false" las oculta.
      - key: APP_ADMIN_PREVIEW_ENABLED
        value: "true"
