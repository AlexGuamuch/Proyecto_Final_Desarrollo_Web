name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecciones-service
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: ./mvnw -B verify

      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: lecciones-service/target/surefire-reports/

  imagen:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t lecciones-service:ci lecciones-service

      - name: Probar el contenedor
        run: |
          docker run -d --name app -e PORT=8080 -p 8080:8080 lecciones-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/api/lecciones | grep -q 'leccion-01-hola-mundo'
          test "$(docker exec app id -u)" = "10001"

      - name: Logs del contenedor
        if: always()
        run: docker logs app || true
