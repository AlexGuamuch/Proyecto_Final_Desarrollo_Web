spring.application.name=lecciones-service

# La nube (Render) inyecta el puerto en la variable PORT; localmente se usa 8080.
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
server.error.include-stacktrace=never
server.error.include-message=never

# Solo se expone /actuator/health (health checks de la nube).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Archivos estáticos: el navegador revalida con ETag/Last-Modified en cada visita,
# así un despliegue nuevo se ve sin limpiar la caché.
spring.web.resources.cache.cachecontrol.no-cache=true

# Ubicación de las lecciones dentro del classpath (una carpeta por lección).
app.lecciones.ubicacion=classpath*:lecciones

# Opciones de Configuración que modifican lecciones: importar zip, eliminar y exportar.
# La fase 1 las pide funcionando en memoria; la autenticación llega en la fase 2.
# Se pueden apagar con APP_ADMIN_PREVIEW_ENABLED=false.
app.admin-preview.enabled=${APP_ADMIN_PREVIEW_ENABLED:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Permite responder 413 con JSON a subidas algo mayores al límite en vez de cortar la conexión.
server.tomcat.max-swallow-size=12MB
